<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Campus Event Management</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <header id="navbar"></header>

  <main class="container">
    <div class="auth-card">
      <h1>Create Account</h1>
      <form id="register-form" novalidate>
        <label>Full name<input type="text" name="name" autocomplete="name"></label>
        <label>Email<input type="email" name="email" placeholder="you@uni.edu" autocomplete="email"></label>
        <label>Password<input type="password" name="password" autocomplete="new-password"></label>
        <label>Confirm password<input type="password" name="confirm" autocomplete="new-password"></label>
        <button type="submit" class="btn">Register</button>
      </form>
      <p id="message" class="message"></p>
      <p class="switch">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>

  <footer id="footer"></footer>

  <script src="src/js/data.js"></script>
  <script src="src/components/eventCard.js"></script>
  <script src="src/components/layout.js"></script>
  <script src="src/pages/register.js"></script>
</body>
</html>
